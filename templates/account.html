{% extends 'base.html' %}{% block content %}<a class="back" href="{{ url_for('home') }}">本周任务</a><h1>账号设置</h1><p class="page-lede">{{ me.name }}{% if me.email %}，{{ me.email }}{% endif %}</p>
<div class="section-head"><h2>真实姓名</h2></div><form method="post" action="{{ url_for('account_real_name') }}" class="card stack"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>真实姓名<input name="real_name" value="{{ me.real_name or '' }}" maxlength="20" required placeholder="例如 张伟"></label><p class="hint">球队页里显示在昵称旁边，只有登录的队员能看到。</p><button class="outline">保存真实姓名</button></form>
<div class="section-head"><h2>修改密码</h2></div><form method="post" class="card stack"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>原密码<input name="old_password" type="password" autocomplete="current-password" required></label><label>新密码（至少 10 位）<input name="new_password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><label>再次输入新密码<input name="confirm_password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><p class="hint">修改密码后，需要在所有设备上重新登录。</p><button class="primary">修改密码</button></form>
<div class="section-head"><h2>新手引导</h2></div><form method="post" action="{{ url_for('tour_reset') }}" class="card stack"><input type="hidden" name="csrf" value="{{ csrf_token }}"><p class="hint">新手引导只在第一次进入首页时自动出现，也可以从这里重新打开。</p><button class="outline">重新查看新手引导</button></form>{% endblock %}
