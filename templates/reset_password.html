{% extends 'auth_base.html' %}
{% block title %}找回账号 · LINGNAN UNITED{% endblock %}
{% block content %}
  <h1 id="auth-title">找回账号</h1>
  <p class="auth-lede">填写注册时的真实姓名和已验证的邮箱。重置密码后，需要重新添加通行密钥。</p>
  <form method="post" class="stack auth-form" id="reset-form" data-lock="提交中">
    {{ csrf_field() }}
    <label>真实姓名<input name="real_name" maxlength="20" required autocomplete="name"></label>
    <label>邮箱<input name="email" type="email" maxlength="254" required autocomplete="email"></label>
    <div class="verification-row">
      <label>邮箱验证码<input name="email_code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label>
      <button type="button" id="send-code" class="outline" data-url="{{ url_for('reset_password_send_code') }}">获取验证码</button>
    </div>
    <p class="hint" id="code-status" role="status">验证码 10 分钟内有效。无法使用邮箱时，请联系管理员。</p>
    <label>新密码<input name="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"></label>
    <label>确认新密码<input name="confirm_password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"></label>
    <button class="primary auth-submit">重置密码</button>
  </form>
  <div class="auth-foot"><a href="{{ url_for('login') }}">返回登录</a></div>
  <script src="{{ url_for('static',filename='email-code.js') }}" defer></script>
{% endblock %}
