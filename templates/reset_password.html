{% extends 'base.html' %}{% block content %}<section class="auth"><h1>找回账号</h1><p class="muted">填写注册时的真实姓名和已验证邮箱，通过验证码重置密码。重置后，已有通行密钥会被移除。</p><form method="post" class="card stack" id="reset-form" data-lock="提交中"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>真实姓名<input name="real_name" maxlength="20" required autocomplete="name"></label><label>邮箱<input name="email" type="email" maxlength="254" required autocomplete="email"></label><div class="verification-row"><label>邮箱验证码<input name="email_code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label><button type="button" id="send-code" class="outline" data-url="{{ url_for('reset_password_send_code') }}">获取验证码</button></div><p class="hint" id="code-status" role="status">验证码有效期为 10 分钟；如果无法使用邮箱，请联系管理员。</p><label>新密码<input name="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"></label><label>确认新密码<input name="confirm_password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"></label><button class="primary">重置密码</button><a class="center" href="{{ url_for('login') }}">返回登录</a></form><script src="{{ url_for('static',filename='email-code.js') }}" defer></script></section>{% endblock %}
