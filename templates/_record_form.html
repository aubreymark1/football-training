<form method="post"{% if action_url %} action="{{ action_url }}"{% endif %} enctype="multipart/form-data" class="card stack" data-record-form data-lock="上传中">
  {{ csrf_field() }}
  <input type="hidden" name="moments_notice" value="1">
  <div>
    <label>运动项目<input name="sport" placeholder="选择下方标签或输入" required maxlength="40" autocomplete="off"></label>
    <div class="chips" aria-label="常见运动类型">
      {% for s in ('跑步','力量','有球训练','间歇跑','核心','骑行') %}<button type="button" class="chip" data-sport="{{ s }}">{{ s }}</button>{% endfor %}
    </div>
  </div>
  <label>时长（分钟）<input type="number" name="minutes" min="1" max="1440" required inputmode="numeric" placeholder="45"></label>
  <fieldset class="effort">
    <legend class="field-title">主观用力程度</legend>
    <div class="effort-row">
      {% for n in range(1,11) %}
        <label><input type="radio" name="effort" value="{{ n }}" required aria-label="用力程度 {{ n }}"><span>{{ n }}</span></label>
      {% endfor %}
    </div>
    <div class="effort-scale"><span>1 轻松</span><output aria-live="polite"></output><span>10 极限</span></div>
  </fieldset>
  <div>
    <span class="field-title">记录截图</span>
    <label class="upload mt-6">
      <input type="file" name="image" accept="image/*" required aria-label="选择运动记录截图"><span class="upload-thumb"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5-8 9"/></svg></span><span class="upload-text"><strong>选择截图</strong><small>8MB 以内</small></span>
    </label>
    <p class="form-error" role="alert" hidden></p>
  </div>
  <label>备注（选填）<textarea name="note" maxlength="500" rows="2" placeholder="训练内容补充"></textarea></label>
  <div class="record-privacy">
    <p class="hint">提交后，昵称、训练任务、运动项目、时长、备注和截图会发布到动态，所有登录队员可见。用力程度和审核信息在站内仅本人及管理员可见。</p>
    <p class="hint">管理员使用 AI 分析时，截图、运动项目、时长、用力程度和备注会发送给模型服务。</p>
  </div>
  <button class="primary">{{ submit_label }}</button>
</form>
