{% extends 'base.html' %}{% block title %}安排训练 · 岭足{% endblock %}{% block content %}<link rel="stylesheet" href="{{ url_for('static',filename='training-leave.css') }}">
<div class="training-page"><a class="back" href="{{ url_for('training_sessions') }}">集体训练</a><h1>{{ '编辑训练' if session else '添加训练' }}</h1><form class="card training-form" method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>训练名称<input name="title" required maxlength="100" value="{{ session.title if session else '球队集体训练' }}"></label><label>开始时间（北京时间）<input type="datetime-local" name="starts_at" required value="{{ session.starts_at[:16] if session else '' }}"></label><label>结束时间（北京时间）<input type="datetime-local" name="ends_at" required value="{{ session.ends_at[:16] if session else '' }}"></label><label>地点<input name="location" maxlength="200" value="{{ session.location if session else '' }}"></label><button class="smallbtn">保存</button></form><p class="hint">已有有效请假记录时，开始时间不能直接修改；可取消本场并重新安排。</p></div>{% endblock %}
