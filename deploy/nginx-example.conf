# Example only: add inside the existing HTTPS server block after inspecting it.
# Keep this service private on loopback, and overwrite every forwarded header.
location = /football { return 308 /football/; }
location ^~ /football/ {
    auth_request off;
    client_max_body_size 8m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Prefix /football;
    proxy_pass http://127.0.0.1:5050/;
    proxy_read_timeout 100s;
}
